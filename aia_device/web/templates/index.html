<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>nara // SYSTEM MONITOR</title>
  <style>
    :root {
      --bg: #04060a;
      --bg-2: #06090f;
      --panel: #0a0f17;
      --panel-2: #0c121c;
      --line: #1b2735;
      --line-bright: #2c4156;
      --txt: #cdd9e3;
      --txt-dim: #5d7286;
      --msi-red: #ff1f3d;
      --msi-red-2: #c8102e;
      --cyan: #2fd4ff;
      --amber: #ffb000;
      --green: #36e07a;
      --grid: rgba(47,212,255,0.07);
      --side: #0a0e15;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; }
    body {
      background:
        radial-gradient(1200px 700px at 70% -20%, #0b1622 0%, var(--bg) 55%),
        var(--bg);
      color: var(--txt);
      font-family: "SFMono-Regular", "JetBrains Mono", "Consolas", ui-monospace, monospace;
      font-size: 13px;
      letter-spacing: 0.3px;
    }

    /* ── Top bar (estilo BIOS) ───────────────────────────────────── */
    .topbar {
      display: flex; align-items: center; gap: 18px;
      height: 52px; padding: 0 18px;
      border-bottom: 2px solid var(--msi-red);
      background: linear-gradient(180deg, #0c1119, #06090f);
      position: relative;
    }
    .topbar .brand {
      font-weight: 800; letter-spacing: 3px; font-size: 15px;
      color: #fff; display: flex; align-items: center; gap: 8px;
    }
    .topbar .brand .msi {
      color: var(--msi-red); font-style: italic; font-weight: 900;
    }
    .topbar .spacer { flex: 1; }
    .topbar .stat {
      font-size: 12px; color: var(--txt-dim); letter-spacing: 1px;
      display: flex; align-items: center; gap: 6px;
    }
    .topbar .stat b { color: var(--txt); font-weight: 700; }
    .topbar .stat.hot b { color: var(--msi-red); }
    .topbar .stat.ok b { color: var(--green); }
    .topbar .clock {
      font-size: 15px; font-weight: 700; color: #fff; letter-spacing: 2px;
      min-width: 92px; text-align: right;
    }

    /* ── Layout principal: sidebar + centro ──────────────────────── */
    .layout { display: flex; min-height: calc(100vh - 52px); }

    /* Sidebar de íconos (navegación tipo BIOS) */
    .sidebar {
      width: 116px; flex: 0 0 116px;
      background: linear-gradient(180deg, var(--side), #070b11);
      border-right: 1px solid var(--line);
      padding: 10px 0; display: flex; flex-direction: column; gap: 4px;
    }
    .nav-item {
      display: flex; flex-direction: column; align-items: center; gap: 5px;
      padding: 11px 4px; cursor: pointer; color: var(--txt-dim);
      border-left: 3px solid transparent; transition: all .12s;
      user-select: none;
    }
    .nav-item svg { width: 30px; height: 30px; fill: currentColor; }
    .nav-item .lbl { font-size: 10px; letter-spacing: 1px; text-transform: uppercase; }
    .nav-item:hover { color: var(--txt); background: rgba(47,212,255,0.05); }
    .nav-item.active {
      color: #fff; border-left-color: var(--msi-red);
      background: linear-gradient(90deg, rgba(255,31,61,0.14), transparent);
    }
    .nav-item.active svg { fill: var(--msi-red); filter: drop-shadow(0 0 6px rgba(255,31,61,.6)); }

    /* Centro */
    .center { flex: 1; padding: 18px 22px; min-width: 0; }
    .crumb {
      color: var(--txt-dim); font-size: 11px; letter-spacing: 2px;
      text-transform: uppercase; margin-bottom: 4px;
    }
    .crumb b { color: var(--msi-red); }
    .view-title {
      font-size: 22px; font-weight: 800; color: #fff; letter-spacing: 2px;
      margin: 0 0 14px; display: flex; align-items: center; gap: 12px;
    }
    .view-title .ic { width: 26px; height: 26px; fill: var(--msi-red); }

    .cards { display: grid; grid-template-columns: repeat(12, 1fr); gap: 14px; }
    .card {
      background: linear-gradient(180deg, var(--panel), var(--panel-2));
      border: 1px solid var(--line); border-radius: 4px; padding: 14px 16px;
      position: relative; box-shadow: inset 0 0 0 1px rgba(47,212,255,0.03);
    }
    .card::before {
      content: ""; position: absolute; left: 0; top: 12px; bottom: 12px; width: 2px;
      background: linear-gradient(var(--msi-red), transparent); opacity: .7;
    }
    .card h3 {
      margin: 0 0 10px; font-size: 11px; font-weight: 700; letter-spacing: 2px;
      color: var(--cyan); text-transform: uppercase;
      border-bottom: 1px dashed var(--line); padding-bottom: 6px;
    }
    .col-3 { grid-column: span 3; }
    .col-4 { grid-column: span 4; }
    .col-5 { grid-column: span 5; }
    .col-6 { grid-column: span 6; }
    .col-7 { grid-column: span 7; }
    .col-8 { grid-column: span 8; }
    .col-12 { grid-column: span 12; }

    .big { font-size: 30px; font-weight: 800; color: #fff; letter-spacing: 1px; }
    .big .u { font-size: 13px; color: var(--txt-dim); margin-left: 4px; }
    .sub { color: var(--txt-dim); font-size: 11px; margin-top: 4px; }

    .bar { height: 7px; background: #0a121b; border: 1px solid var(--line); border-radius: 4px; margin-top: 8px; overflow: hidden; }
    .bar > i { display: block; height: 100%; background: linear-gradient(90deg, var(--cyan), var(--msi-red)); transition: width .4s; }

    table { width: 100%; border-collapse: collapse; }
    td { padding: 4px 2px; border-bottom: 1px solid rgba(27,39,53,0.6); }
    td.k { color: var(--txt-dim); }
    td.v { text-align: right; font-weight: 700; color: var(--txt); }

    .brandline { display: flex; align-items: baseline; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
    .brandline .b { color: var(--msi-red); font-weight: 800; letter-spacing: 2px; }
    .brandline .m { color: var(--txt); font-weight: 600; }

    canvas { width: 100%; height: 180px; display: block; }
    .legend { display: flex; gap: 14px; margin-top: 6px; font-size: 11px; color: var(--txt-dim); }
    .legend i { display: inline-block; width: 10px; height: 3px; margin-right: 5px; vertical-align: middle; }

    .history-controls { display: flex; align-items: center; gap: 8px; }
    .history-controls label { color: var(--txt-dim); font-size: 11px; letter-spacing: 1px; text-transform: uppercase; }
    .history-controls select {
      appearance: none; background: rgba(10,16,24,0.95); color: var(--txt);
      border: 1px solid var(--line-bright); border-radius: 999px; padding: 6px 10px;
      font-family: inherit; font-size: 11px; outline: none;
    }
    .history-controls select option { background: var(--panel); color: var(--txt); }

    .foot { color: var(--txt-dim); font-size: 11px; text-align: center; padding: 14px; }

    .na { color: var(--txt-dim); }
    .hidden { display: none !important; }

    @media (max-width: 900px) {
      .col-3,.col-4,.col-5,.col-6,.col-7,.col-8 { grid-column: span 12; }
      .sidebar { width: 84px; flex-basis: 84px; }
    }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="brand"><span class="msi">MSI</span> ClickBIOS · NARA</div>
    <div class="spacer"></div>
    <div class="stat ok"><span class="status-dot"></span>ONLINE</div>
    <div class="stat">TEMP <b id="tb-temp">--°C</b></div>
    <div class="stat">WATTS <b id="tb-watts">-- W</b></div>
    <div class="history-controls">
      <label for="range-select">HIST</label>
      <select id="range-select">
        <option value="1h">1h</option>
        <option value="1d">1d</option>
      </select>
    </div>
    <div class="clock" id="clock">--:--:--</div>
  </div>

  <div class="layout">
    <nav class="sidebar" id="sidebar">
      <div class="nav-item active" data-view="system">
        <svg viewBox="0 0 24 24"><path d="M3 3h8v8H3V3zm10 0h8v8h-8V3zM3 13h8v8H3v-8zm10 0h8v8h-8v-8z"/></svg>
        <span class="lbl">System</span>
      </div>
      <div class="nav-item" data-view="cpu">
        <svg viewBox="0 0 24 24"><path d="M7 7h10v10H7V7zm-3 3H2v4h2v-4zm16 0h-2v4h2v-4zM9 2v2h6V2H9zm0 20v-2h6v2H9z"/></svg>
        <span class="lbl">CPU</span>
      </div>
      <div class="nav-item" data-view="gpu">
        <svg viewBox="0 0 24 24"><path d="M3 5h18v11H13l4 3v2h-2l-2-3H8l-2 3H4v-2l4-3H3V5zm3 3v6h12V8H6z"/></svg>
        <span class="lbl">GPU</span>
      </div>
      <div class="nav-item" data-view="ram">
        <svg viewBox="0 0 24 24"><path d="M2 7h20v4H2V7zm0 6h20v4H2v-4zM5 4v3h2V4H5zm4 0v3h2V4H9zm4 0v3h2V4h-2zm4 0v3h2V4h-2z"/></svg>
        <span class="lbl">RAM</span>
      </div>
      <div class="nav-item" data-view="vram">
        <svg viewBox="0 0 24 24"><path d="M3 5h18v11H13l4 3v2h-2l-2-3H8l-2 3H4v-2l4-3H3V5zm3 3v6h12V8H6z"/></svg>
        <span class="lbl">VRAM</span>
      </div>
      <div class="nav-item" data-view="watts">
        <svg viewBox="0 0 24 24"><path d="M13 2L4 14h6l-1 8 9-12h-6l1-8z"/></svg>
        <span class="lbl">Watts</span>
      </div>
      <div class="nav-item" data-view="disk">
        <svg viewBox="0 0 24 24"><path d="M4 4h16v16H4V4zm2 2v5h12V6H6zm0 8v4h5v-4H6zm7 0v4h5v-4h-5z"/></svg>
        <span class="lbl">Disco</span>
      </div>
      <div class="nav-item" data-view="net">
        <svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 100 20 10 10 0 000-20zm0 3a7 7 0 015.2 2.3L12 12 6.8 7.3A7 7 0 0112 5zm-7 7a7 7 0 014.3-5.2L12 12l-4.9 5.2A7 7 0 015 12zm14 0a7 7 0 01-4.3 5.2L12 12l4.9-5.2A7 7 0 0119 12z"/></svg>
        <span class="lbl">Red</span>
      </div>
    </nav>

    <main class="center">
      <div class="crumb">ClickBIOS 5 &nbsp;/&nbsp; <b id="crumb">System</b></div>
      <div id="view-root"></div>
    </main>
  </div>

  <div class="foot">nara-monitor · refresh 1.5s · datos en vivo del host</div>

  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>

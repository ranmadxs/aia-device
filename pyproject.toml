[tool.poetry]
name = "aia-device"
version = "1.0.2"
description = "nara host real-time monitor (CPU/GPU/RAM/disk/net/temps + total watts)"
authors = ["Edgar Rodrigo Sanchez De Gracia <grineldosanchez@yahoo.es>"]
readme = "README.md"
packages = [{include = "aia_device"}]

[tool.poetry.dependencies]
python = "^3.13"
python-dotenv = "^1.0.0"
Flask = "^3.0.0"
psutil = "^5.9.8"
aia_utils = "^1.0.0"

[tool.pytest.ini_options]
pythonpath = "aia_device"

[tool.poetry.group.dev.dependencies]
pytest = "^7.1.3"
pytest-dotenv = "^0.5.2"
pytest-cov = "^4.0.0"

[tool.poetry.scripts]
daemon = 'aia_device.daemon:run'

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

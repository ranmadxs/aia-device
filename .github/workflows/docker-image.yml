name: Docker Image Publish

# Copiado y adaptado del workflow de aia-utils (keitarodxs/aia-utils-base).
# La imagen que se publica aquí es la que luego se instala/despliega en nara.
on:
  pull_request:
  push:
    branches:
      - "main"
    tags:
      - "v*.*.*"

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set docker tag version
      # - Tag (vX.Y.Z): usa el nombre del tag tal cual.
      # - Merge a main (push a main): usa la versión del pyproject.toml
      #   (poetry version --short), ej. 1.0.0. Así al mezclar el PR se publica
      #   la imagen release con el tag de la versión del paquete.
      # - PR: usa el nombre de rama sanitizado (ej. feat-nara-monitor) para
      #   construir sin tag de release. (Bloque temporal: se saca cuando funcione.)
      env:
        REF_TYPE: ${{ github.ref_type }}
        REF_NAME: ${{ github.ref_name }}
        REF: ${{ github.ref }}
        HEAD_REF: ${{ github.head_ref }}
      run: |
        if [ "$REF_TYPE" = "tag" ]; then
          echo "RELEASE_VERSION=$REF_NAME" >> "$GITHUB_ENV"
        elif [ "$REF" = "refs/heads/main" ]; then
          echo "RELEASE_VERSION=$(poetry version --short)" >> "$GITHUB_ENV"
        else
          SAFE=$(echo "${HEAD_REF:-$REF_NAME}" | tr '/' '-')
          echo "RELEASE_VERSION=$SAFE" >> "$GITHUB_ENV"
        fi
    - name: Test
      run: |
          echo $RELEASE_VERSION
          echo ${{ env.RELEASE_VERSION }}
    - name: Build & Push to Docker Hub
      # Mismo action que aia-utils: opspresso/action-docker con BUILDX.
      uses: opspresso/action-docker@master
      with:
          args: --docker
      env:
          USERNAME: ${{ secrets.DOCKER_USERNAME }}
          PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          TAG_NAME: ${{ env.RELEASE_VERSION }}
          BUILDX: "true"
          PLATFORMS: "linux/amd64"
          IMAGE_NAME: "keitarodxs/aia-device"

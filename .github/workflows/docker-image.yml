name: Docker Image Publish

on:
  pull_request:
  push:
    branches:
      - "main"
    tags:
      - "v*.*.*"

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set docker tag version
      # - Tag (vX.Y.Z): usa el nombre del tag tal cual.
      # - Merge a main (push a main): usa la versión del pyproject.toml
      #   (poetry version --short), ej. 1.0.0. Así al mezclar el PR se publica
      #   la imagen release con el tag de la versión del paquete.
      # - PR: usa el nombre de rama sanitizado (ej. feat-nara-monitor) para
      #   construir sin tag de release. (Bloque temporal: se saca cuando funcione.)
      env:
        REF_TYPE: ${{ github.ref_type }}
        REF_NAME: ${{ github.ref_name }}
        REF: ${{ github.ref }}
        HEAD_REF: ${{ github.head_ref }}
      run: |
        if [ "$REF_TYPE" = "tag" ]; then
          echo "RELEASE_VERSION=$REF_NAME" >> "$GITHUB_ENV"
        elif [ "$REF" = "refs/heads/main" ]; then
          echo "RELEASE_VERSION=$(poetry version --short)" >> "$GITHUB_ENV"
        else
          SAFE=$(echo "${HEAD_REF:-$REF_NAME}" | tr '/' '-')
          echo "RELEASE_VERSION=$SAFE" >> "$GITHUB_ENV"
        fi
    - name: Test
      run: |
          echo $RELEASE_VERSION
          echo ${{ env.RELEASE_VERSION }}
    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    - name: Build & Push to Docker Hub
      uses: docker/build-push-action@v4
      with:
          context: .
          push: true
          tags: keitarodxs/aia_device:${{ env.RELEASE_VERSION }}
          platforms: linux/amd64
      env:
          USERNAME: ${{ secrets.DOCKER_USERNAME }}
          PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          TAG_NAME: ${{ env.RELEASE_VERSION }}
          BUILDX: "true"
          IMAGE_NAME: "keitarodxs/aia-device"
